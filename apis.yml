aid: normunity
name: Normunity
description: Normunity is a clinical-stage biotechnology company developing novel anti-cancer
  therapies that work at the interface of the immune system and the tumor. In collaboration
  with the Lieping Chen lab at the Yale School of Medicine, Normunity has identified a
  novel class of "Immuno-smart targets" — tumor-specific, cell-surface proteins co-opted
  by cancer cells to drive local immune suppression — and is building a pipeline of biologic
  medicines including therapeutic antibodies, bispecific antibodies, and payload-carrying
  biologics. Its lead program, NRM-823, is a T cell engager that has entered clinical trials.
  Normunity is backed by Canaan Partners. This is a corporate/scientific company with no
  public API, developer portal, or programmatic surface.
